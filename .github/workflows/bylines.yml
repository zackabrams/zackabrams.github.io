name: Refresh latest bylines

on:
  schedule:
    # Weekends only, hourly, since that's when Zack files. Times are UTC:
    # Saturday and Sunday all day, plus Monday 00:00-05:00 UTC to cover
    # Sunday evening in New York. The RSS feed only holds ~19 stories.
    - cron: "17 * * * 6,0"
    - cron: "17 0-5 * * 1"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/fetch_bylines.py
      - .github/workflows/bylines.yml

permissions:
  contents: write

concurrency:
  group: bylines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest stories from The Block
        run: python3 scripts/fetch_bylines.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- bylines.json && ! git ls-files --others --exclude-standard | grep -q '^bylines.json$'; then
            echo "bylines unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bylines.json
          git commit -m "Refresh latest bylines from The Block"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1
