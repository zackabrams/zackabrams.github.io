<script>
// Spoondle moved to spoondle.zackabrams.com. Keep the puzzle in the link (?p=), and bring this browser's
// saved puzzles and settings along after the #, which stays in the browser and is never sent to a server.
(function () {
  var to = 'https://spoondle.zackabrams.com/' + location.search, saved = {}, any = false;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var key = localStorage.key(i);
      if (key.indexOf('spoondle-') === 0) { saved[key] = localStorage.getItem(key); any = true; }
    }
  } catch (e) {}
  location.replace(any ? to + '#carry=' + encodeURIComponent(JSON.stringify(saved)) : to);
})();
</script>
